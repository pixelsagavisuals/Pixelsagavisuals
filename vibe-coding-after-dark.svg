<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Arpit Singh - Vibe Coding After Dark">
  <title>Vibe Coding After Dark - Arpit Singh (wallzivo)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.45" stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E5E7EB" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#4C1D95" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E5E7EB">
    <circle cx="80" cy="50" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="120" r="1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="150" r="1" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="6s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="130" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="5.5s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="55" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="150" r="1" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="6.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1" opacity="0.45"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="140" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.2s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.8s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="1.4" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.4s" begin="-2.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="45" r="1" opacity="0.45"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="140" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.2s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="55" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.6s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="5.4s" begin="-2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="60" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.8s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="180" r="1" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="5.6s" begin="-2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="200" r="1" opacity="0.3"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="6.2s" begin="-3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon + glow pulse -->
  <g>
    <circle cx="1050" cy="88" r="55" fill="url(#moonGlow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="88" r="26" fill="#E8E9F0"/>
    <circle cx="1042" cy="80" r="4" fill="#C7C9D9" opacity="0.7"/>
    <circle cx="1058" cy="95" r="3" fill="#C7C9D9" opacity="0.6"/>
    <circle cx="1050" cy="72" r="2.5" fill="#C7C9D9" opacity="0.5"/>
  </g>

  <!-- floating pixels -->
  <g>
    <rect x="300" y="90" width="4" height="4" fill="#7C3AED" opacity="0.4" rx="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -8;0 0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="740" y="80" width="3" height="3" fill="#3B82F6" opacity="0.4" rx="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 10;0 0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="190" width="3" height="3" fill="#A78BFA" opacity="0.3" rx="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 8;0 0" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="860" y="120" width="4" height="4" fill="#7C3AED" opacity="0.45" rx="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 -9;0 0" dur="8.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="220" width="3" height="3" fill="#3B82F6" opacity="0.35" rx="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;9 6;0 0" dur="9.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== BRANDING TEXT ===== -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="600" y="48" font-size="13" letter-spacing="8" fill="#A78BFA" opacity="0.9">ARPIT SINGH</text>
    <text x="600" y="84" font-size="30" letter-spacing="10" font-weight="600" fill="#E5E7EB">VIBE CODING AFTER DARK</text>
    <rect x="460" y="98" width="280" height="1.5" fill="#7C3AED" opacity="0.6"/>
  </g>

  <!-- ===== AI ORB ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="470" cy="140" r="24" fill="url(#aiGlow)"/>
    <circle cx="470" cy="140" r="7" fill="#EDE9FE" opacity="0.95"/>
    <circle cx="470" cy="140" r="11" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.45"/>
    <circle r="1.8" fill="#A78BFA">
      <animateMotion path="M -16 0 A 16 16 0 1 1 16 0 A 16 16 0 1 1 -16 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.3" fill="#3B82F6">
      <animateMotion path="M 16 0 A 16 16 0 1 1 -16 0 A 16 16 0 1 1 16 0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M485,128 l2,0 M486,127 l0,2" stroke="#A78BFA" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== CHARACTER (silhouette, subtle breathing) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="6s" repeatCount="indefinite"/>
    <!-- neck -->
    <rect x="392" y="220" width="16" height="12" fill="#0F0F1A"/>
    <!-- torso -->
    <path d="M335,325 C332,265 365,238 400,236 C435,238 468,265 465,325 Z" fill="#0F0F1A"/>
    <!-- head -->
    <circle cx="400" cy="206" r="23" fill="#0F0F1A"/>
    <!-- purple rim light -->
    <path d="M414,190 A23,23 0 0 1 414,222" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.35"/>
    <path d="M462,300 C462,266 440,244 424,239" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.3"/>
    <!-- typing arm -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="0.65s" repeatCount="indefinite"/>
      <path d="M448,268 Q500,268 528,292" stroke="#12121C" stroke-width="13" stroke-linecap="round" fill="none"/>
      <circle cx="530" cy="293" r="6.5" fill="#12121C"/>
    </g>
  </g>

  <!-- ===== DESK ===== -->
  <rect x="150" y="316" width="8" height="54" fill="#101019"/>
  <rect x="1012" y="316" width="8" height="54" fill="#101019"/>
  <rect x="130" y="306" width="940" height="10" rx="2" fill="#171724"/>
  <rect x="130" y="306" width="940" height="2" fill="#7C3AED" opacity="0.18"/>

  <!-- ===== LAPTOP ===== -->
  <!-- screen glow behind -->
  <ellipse cx="640" cy="235" rx="190" ry="110" fill="url(#screenGlow)" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.65;0.4" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <!-- screen bezel -->
  <rect x="540" y="172" width="200" height="120" rx="8" fill="#141420" stroke="#26263A" stroke-width="1.5"/>
  <!-- screen -->
  <rect x="548" y="180" width="184" height="104" rx="4" fill="#090913"/>
  <rect x="548" y="180" width="184" height="12" fill="#12121E"/>
  <circle cx="558" cy="186" r="2" fill="#A78BFA"/>
  <circle cx="568" cy="186" r="2" fill="#7C3AED"/>
  <circle cx="578" cy="186" r="2" fill="#3B82F6"/>
  <!-- animated code lines -->
  <g opacity="0.9">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="8s" repeatCount="indefinite"/>
    <rect x="560" y="200" width="54" height="5" rx="2.5" fill="#7C3AED"/>
    <rect x="620" y="200" width="88" height="5" rx="2.5" fill="#3B82F6" opacity="0.7"/>
  </g>
  <g opacity="0.9">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="8s" begin="-1s" repeatCount="indefinite"/>
    <rect x="574" y="212" width="110" height="5" rx="2.5" fill="#4B5563"/>
  </g>
  <g opacity="0.9">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="8s" begin="-2s" repeatCount="indefinite"/>
    <rect x="574" y="224" width="40" height="5" rx="2.5" fill="#A78BFA"/>
    <rect x="620" y="224" width="62" height="5" rx="2.5" fill="#7C3AED" opacity="0.7"/>
  </g>
  <g opacity="0.9">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="8s" begin="-3s" repeatCount="indefinite"/>
    <rect x="560" y="236" width="130" height="5" rx="2.5" fill="#4B5563"/>
  </g>
  <g opacity="0.9">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="8s" begin="-4s" repeatCount="indefinite"/>
    <rect x="574" y="248" width="70" height="5" rx="2.5" fill="#3B82F6" opacity="0.7"/>
  </g>
  <!-- screen label + blinking cursor -->
  <text x="640" y="272" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="10" letter-spacing="3" fill="#A78BFA" opacity="0.95">VIBE CODING</text>
  <rect x="700" y="264" width="4" height="11" fill="#C4B5FD">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- keyboard base -->
  <polygon points="535,290 745,290 768,306 512,306" fill="#161622" stroke="#26263A" stroke-width="1"/>
  <!-- key lights -->
  <g fill="#7C3AED">
    <rect x="548" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="585" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" begin="-0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="622" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" begin="-0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="659" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" begin="-0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="696" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="733" y="293" width="8" height="4" rx="1" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" begin="-0.45s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- laptop label -->
  <text x="640" y="303" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="7.5" letter-spacing="2.5" fill="#7C3AED" opacity="0.55">WALLZIVO</text>

  <!-- ===== HEADPHONES ===== -->
  <g>
    <path d="M197,293 Q237,272 277,293" fill="none" stroke="#26263A" stroke-width="5"/>
    <circle cx="197" cy="297" r="9" fill="#14141F" stroke="#2A2A3A" stroke-width="1.5"/>
    <circle cx="277" cy="297" r="9" fill="#14141F" stroke="#2A2A3A" stroke-width="1.5"/>
    <circle cx="197" cy="297" r="4" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
    <circle cx="277" cy="297" r="4" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ===== MUG ===== -->
  <g>
    <rect x="830" y="274" width="26" height="32" rx="4" fill="#14141F" stroke="#2A2A3A" stroke-width="1.5"/>
    <path d="M856,282 q12,4 0,14" fill="none" stroke="#2A2A3A" stroke-width="3"/>
    <path d="M838,268 q3,-6 0,-12" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M848,268 q3,-6 0,-12" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.2">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== MINI GAME PANEL (gaming-inspired accent) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="880" y="170" width="150" height="95" rx="8" fill="#0A0A14" fill-opacity="0.88" stroke="#312E81" stroke-width="1.5"/>
    <rect x="880" y="170" width="150" height="10" rx="5" fill="#12122A" opacity="0.9"/>
    <circle cx="892" cy="175" r="1.8" fill="#7C3AED"/>
    <circle cx="901" cy="175" r="1.8" fill="#A78BFA" opacity="0.6"/>
    <circle cx="910" cy="175" r="1.8" fill="#3B82F6" opacity="0.6"/>
    <!-- target -->
    <rect x="970" y="210" width="14" height="14" rx="2" fill="#7C3AED" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- projectile -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.06;0.34;0.38;1" dur="8s" repeatCount="indefinite"/>
      <circle r="6" fill="#8B5CF6" opacity="0.35"/>
      <circle r="3" fill="#A78BFA"/>
      <animateMotion path="M895,238 Q935,200 977,217" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    </g>
    <!-- pixel burst on hit -->
    <g fill="#A78BFA">
      <rect x="976" y="216" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.35;0.38;0.46;1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 -5;-9 -9" keyTimes="0;0.35;0.38;0.46" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="976" y="216" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.35;0.38;0.46;1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 -5;9 -9" keyTimes="0;0.35;0.38;0.46" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="976" y="216" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.35;0.38;0.46;1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 5;-9 9" keyTimes="0;0.35;0.38;0.46" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="976" y="216" width="3" height="3" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.35;0.38;0.46;1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 5;9 9" keyTimes="0;0.35;0.38;0.46" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- hit flash -->
    <rect x="970" y="210" width="14" height="14" rx="2" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.35;0.37;0.44;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== PIXELSAGA BADGE ===== -->
  <g>
    <rect x="110" y="345" width="118" height="22" rx="11" fill="#0D0D18" stroke="#312E81" stroke-width="1.2"/>
    <text x="169" y="359.5" text-anchor="middle" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="9" letter-spacing="3" fill="#A78BFA" opacity="0.85">PIXELSAGA</text>
    <path d="M236,347 l2.5,0 M237.25,345.75 l0,2.5" stroke="#A78BFA" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- signature -->
  <text x="1140" y="375" text-anchor="end" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="9" letter-spacing="1.5" fill="#4B5563" opacity="0.8">github.com/wallzivo · wallzivo.com</text>

  <!-- vignette -->
  <rect width="1200" height="400" fill="url(#vignette)" pointer-events="none"/>
</svg>
