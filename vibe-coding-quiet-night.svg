<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Arpit Singh — Quiet Night, Building Ideas</title>
  <desc id="desc">A peaceful illustrated night workspace with a laptop, warm desk lamp, plants, moon, stars and subtle animated details.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#17152a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a31"/><stop offset="1" stop-color="#272243"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292536"/><stop offset="1" stop-color="#14131c"/>
    </linearGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#f5dca8" stop-opacity=".38"/><stop offset="1" stop-color="#f5dca8" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#eee9df}
      .small{font-family:Inter,Arial,sans-serif;fill:#bcb6c9;font-size:14px;letter-spacing:2px}
      .code{font-family:monospace;font-size:11px}
    </style>
  </defs>

  <!-- calm night background -->
  <rect width="1200" height="420" rx="24" fill="url(#sky)"/>
  <circle cx="920" cy="92" r="42" fill="#eee7d5" opacity=".95"/>
  <circle cx="936" cy="78" r="42" fill="#10162a"/>

  <!-- stars, softly twinkling -->
  <g fill="#e9e2d2">
    <circle cx="120" cy="70" r="1.4"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="112" r="1.2"><animate attributeName="opacity" values="1;.25;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="335" cy="58" r="1.3"><animate attributeName="opacity" values=".3;.9;.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="90" r="1.3"><animate attributeName="opacity" values=".8;.2;.8" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="52" r="1.2"><animate attributeName="opacity" values=".2;.85;.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="132" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- distant quiet hills, no city -->
  <path d="M0 205 Q145 150 270 210 T510 195 T760 205 T1000 175 T1200 205 V285 H0Z" fill="#151b2d"/>
  <path d="M0 230 Q130 190 260 235 T520 225 T790 238 T1030 215 T1200 230 V285 H0Z" fill="#1d2032"/>
  <g opacity=".5" fill="#101522">
    <path d="M60 275 l34-70 30 70zM145 275 l42-86 35 86zM1030 275 l38-78 36 78zM1100 275 l48-96 42 96z"/>
  </g>

  <!-- window -->
  <rect x="65" y="35" width="520" height="245" rx="14" fill="#080b14" stroke="#3a3548" stroke-width="2"/>
  <rect x="78" y="48" width="494" height="219" rx="9" fill="url(#window)"/>
  <path d="M325 48v219" stroke="#3a3548" stroke-width="2"/>
  <path d="M78 158h494" stroke="#3a3548" stroke-width="2"/>
  <text x="102" y="93" class="small">QUIET NIGHT</text>
  <text x="102" y="118" class="label" font-size="22" font-weight="600">A little time to build.</text>
  <text x="102" y="143" class="small">CODE · CREATE · LEARN</text>

  <!-- left plant -->
  <path d="M45 345 Q50 290 74 258 Q78 302 67 345Z" fill="#25362f"/>
  <path d="M88 345 Q92 286 122 263 Q120 310 104 345Z" fill="#2c4036"/>
  <path d="M18 345 Q25 304 47 281 Q47 320 39 345Z" fill="#30443a"/>
  <rect x="40" y="337" width="75" height="48" rx="9" fill="#6b574e"/>

  <!-- desk -->
  <path d="M0 315 Q240 300 480 314 T960 312 T1200 315 V420 H0Z" fill="url(#desk)"/>
  <path d="M0 315 Q240 300 480 314 T960 312 T1200 315" fill="none" stroke="#4a4250" stroke-width="2"/>

  <!-- warm lamp and glow -->
  <ellipse cx="1040" cy="300" rx="155" ry="120" fill="url(#lampGlow)" filter="url(#soft)"/>
  <path d="M1018 168 L1060 168 L1087 220 L991 220Z" fill="#d5b67d"/>
  <path d="M1039 220v72" stroke="#8d7b66" stroke-width="7"/>
  <ellipse cx="1039" cy="294" rx="42" ry="7" fill="#574c48"/>
  <circle cx="1039" cy="207" r="10" fill="#f4dfa9"><animate attributeName="opacity" values=".72;1;.72" dur="3s" repeatCount="indefinite"/></circle>

  <!-- person silhouette -->
  <circle cx="470" cy="275" r="34" fill="#171722"/>
  <path d="M412 366 Q416 299 470 296 Q524 299 544 366Z" fill="#161722"/>
  <path d="M444 300 Q470 315 495 300" fill="none" stroke="#756a7f" stroke-width="2" opacity=".5"/>

  <!-- laptop -->
  <rect x="420" y="246" width="360" height="175" rx="12" fill="#0b0b11" stroke="#777080" stroke-width="3"/>
  <rect x="438" y="261" width="324" height="140" rx="7" fill="#111521"/>
  <path d="M399 420h402l-24 12H425Z" fill="#4b4651"/>
  <text x="457" y="287" class="small" font-size="10">WALLZIVO / WORKSPACE</text>
  <g class="code" fill="#bdb6c9">
    <text x="457" y="310">const idea = create();</text>
    <text x="457" y="327">build(idea)</text>
    <text x="457" y="344">learn → improve → repeat</text>
    <text x="457" y="361">AI.assist(true)</text>
    <text x="457" y="378">design.with(care)</text>
  </g>
  <rect x="457" y="389" width="72" height="3" rx="2" fill="#8e82a3">
    <animate attributeName="width" values="18;72;18" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- small notebook -->
  <rect x="820" y="340" width="130" height="54" rx="7" fill="#29242f" stroke="#514a58"/>
  <text x="838" y="364" class="small" font-size="11">ARPIT SINGH</text>
  <text x="838" y="382" class="small" font-size="9">BUILDING QUIETLY</text>

  <!-- phone -->
  <rect x="715" y="344" width="66" height="108" rx="10" fill="#090a0f" stroke="#625b67" stroke-width="2"/>
  <rect x="723" y="355" width="50" height="86" rx="6" fill="#151927"/>
  <text x="731" y="380" class="small" font-size="8">ANDROID</text>
  <circle cx="748" cy="410" r="7" fill="#75806f" opacity=".7"><animate attributeName="opacity" values=".35;.8;.35" dur="4s" repeatCount="indefinite"/></circle>

  <!-- mug -->
  <path d="M965 344h58v48h-58z" fill="#3b3440"/>
  <path d="M1023 355q32 0 0 28" fill="none" stroke="#645968" stroke-width="6"/>
  <path d="M980 335q-7-17 3-28M1000 335q-6-17 4-28" fill="none" stroke="#c7b7a0" stroke-width="2" opacity=".3">
    <animate attributeName="opacity" values=".1;.4;.1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- subtle floating idea dots -->
  <g fill="#b9a9c7">
    <circle cx="808" cy="180" r="3"><animate attributeName="cy" values="180;166;180" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="205" r="2"><animate attributeName="cy" values="205;190;205" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="174" r="2"><animate attributeName="cy" values="174;185;174" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- signature -->
  <text x="610" y="92" class="label" font-size="18" text-anchor="middle" opacity=".9">Arpit Singh</text>
  <text x="610" y="116" class="small" text-anchor="middle">VIBE CODER · AI ARTIST · DESIGNER · ANDROID BUILDER</text>
  <text x="610" y="141" class="small" text-anchor="middle" opacity=".75">Wallzivo · PixelSaga Visuals</text>

  <!-- gentle footer line -->
  <path d="M250 402 Q600 390 950 402" fill="none" stroke="#6b6175" stroke-width="1" opacity=".55"/>
  <text x="600" y="398" class="small" text-anchor="middle" font-size="10" opacity=".65">learning · building · creating</text>
</svg>
